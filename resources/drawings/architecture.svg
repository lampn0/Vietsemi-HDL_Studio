<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <!-- HDL Studio architecture: layers of the code (src/) and the files they read / write.
       Edit this file by hand (plain SVG); docs/architecture.md embeds it. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box { stroke: #333; stroke-width: 1.2; rx: 6; }
      .gui { fill: #dceeff; }
      .core { fill: #e8f6e0; }
      .io { fill: #fff3d6; }
      .file { fill: #f3f3f3; stroke-dasharray: 4 3; }
      .title { font-weight: bold; font-size: 14px; }
      .small { font-size: 11.5px; fill: #333; }
      .layer { font-size: 12px; fill: #666; font-style: italic; }
      .line { stroke: #444; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

  <!-- launchers -->
  <text x="20" y="28" class="layer">bin/ (launchers)</text>
  <rect x="20" y="38" width="200" height="44" class="box io"/>
  <text x="34" y="58" class="title">hdlstudio.py</text>
  <text x="34" y="74" class="small">Design Manager entry point</text>
  <rect x="240" y="38" width="190" height="44" class="box io"/>
  <text x="254" y="58" class="title">fsm_editor.py</text>
  <text x="254" y="74" class="small">stand-alone FSM editor</text>

  <!-- GUI layer -->
  <text x="20" y="112" class="layer">src/gui (PySide6)</text>
  <rect x="20" y="122" width="940" height="150" class="box gui" style="fill:#f4f9ff"/>
  <rect x="36" y="136" width="270" height="60" class="box gui"/>
  <text x="50" y="158" class="title">DesignManager</text>
  <text x="50" y="175" class="small">design_manager.py: projects, library tabs,</text>
  <text x="50" y="189" class="small">session, autosave, generation, Log</text>
  <rect x="326" y="136" width="200" height="60" class="box gui"/>
  <text x="340" y="158" class="title">EditorContext</text>
  <text x="340" y="175" class="small">context.py: locks, save,</text>
  <text x="340" y="189" class="small">generate, read-only</text>
  <rect x="546" y="136" width="200" height="60" class="box gui"/>
  <text x="560" y="158" class="title">MainWindow (FSM)</text>
  <text x="560" y="175" class="small">main_window.py +</text>
  <text x="560" y="189" class="small">diagram.py (FsmScene)</text>
  <rect x="760" y="136" width="186" height="60" class="box gui"/>
  <text x="774" y="158" class="title">BdEditorWindow</text>
  <text x="774" y="175" class="small">bd_editor.py</text>
  <text x="774" y="189" class="small">(BdScene, items)</text>
  <rect x="36" y="206" width="910" height="54" class="box gui" style="fill:#eaf3ff"/>
  <text x="50" y="226" class="small">shared: menus.py · toolbars.py · command_names.py (legacy names, keys) · undo.py (snapshot undo) · icons.py / dm_icons.py</text>
  <text x="50" y="244" class="small">dialogs: dialogs.py · bd_dialogs.py · sm_props_dialog.py · sm_machine_dialog.py · dm_options.py · main_settings.py · tables.py · props.py · text_editor.py</text>

  <!-- core layer -->
  <text x="20" y="302" class="layer">src/ core (no Qt)</text>
  <rect x="20" y="312" width="225" height="96" class="box core"/>
  <text x="34" y="334" class="title">project/</text>
  <text x="34" y="352" class="small">hdp.py · project.py (Project,</text>
  <text x="34" y="367" class="small">Library, DesignUnit, View)</text>
  <text x="34" y="382" class="small">generate.py · lock.py</text>
  <text x="34" y="397" class="small">templates.py</text>
  <rect x="260" y="312" width="225" height="96" class="box core"/>
  <text x="274" y="334" class="title">model.py · bd_model.py</text>
  <text x="274" y="352" class="small">FsmView / Machine / State /</text>
  <text x="274" y="367" class="small">Transition; BlockDiagram /</text>
  <text x="274" y="382" class="small">BdInstance / BdWire ...</text>
  <text x="274" y="397" class="small">JSON save / load</text>
  <rect x="500" y="312" width="225" height="96" class="box core"/>
  <text x="514" y="334" class="title">codegen/</text>
  <text x="514" y="352" class="small">fsm_codegen.py · bd_codegen.py</text>
  <text x="514" y="367" class="small">common.py (style, ports)</text>
  <text x="514" y="382" class="small">encoding.py · hierarchy.py</text>
  <text x="514" y="397" class="small">model -> Verilog / SV text</text>
  <rect x="740" y="312" width="220" height="96" class="box core"/>
  <text x="754" y="334" class="title">prefs.py · session.py</text>
  <text x="754" y="352" class="small">~/.config/vietsemi-hdl-studio/</text>
  <text x="754" y="367" class="small">prefs.json, session.json,</text>
  <text x="754" y="382" class="small">autosave/, caches</text>

  <!-- io layer -->
  <text x="20" y="441" class="layer">I/O</text>
  <rect x="20" y="448" width="465" height="70" class="box io"/>
  <text x="34" y="470" class="title">formats/  (legacy file formats)</text>
  <text x="34" y="488" class="small">sexpr.py (S-expression parse / write, byte-exact) · import_sm.py · export_sm.py</text>
  <text x="34" y="504" class="small">import_bd.py · export_sb.py (symbol ports)</text>
  <rect x="500" y="448" width="460" height="70" class="box io"/>
  <text x="514" y="470" class="title">hdl/parser.py</text>
  <text x="514" y="488" class="small">Verilog / SystemVerilog units, ports, parameters, instances</text>
  <text x="514" y="504" class="small">(pyslang; regex fallback) · check_text() syntax check</text>

  <!-- files -->
  <text x="20" y="548" class="layer">files (legacy layout)</text>
  <rect x="20" y="558" width="300" height="62" class="box file"/>
  <text x="34" y="580" class="title">project.hdp</text>
  <text x="34" y="598" class="small">[hdl] / [hds] library mapping, settings,</text>
  <text x="34" y="612" class="small">[shared] team project</text>
  <rect x="340" y="558" width="300" height="62" class="box file"/>
  <text x="354" y="580" class="title">&lt;lib&gt;/hds/&lt;unit&gt;/</text>
  <text x="354" y="598" class="small">fsm.sm · struct.bd · symbol.sb · *.lck</text>
  <text x="354" y="612" class="small">*.fsm.json · *.bd.json · .hdlstudio_gen.json</text>
  <rect x="660" y="558" width="300" height="62" class="box file"/>
  <text x="674" y="580" class="title">&lt;lib&gt;/hdl/</text>
  <text x="674" y="598" class="small">*.v / *.sv: hand-written source and</text>
  <text x="674" y="612" class="small">files generated by codegen/</text>

  <!-- arrows: "A -> B" means A uses / reads B -->
  <path d="M120,82 L120,136" class="line"/>
  <path d="M335,82 L335,100 L646,100 L646,136" class="line"/>
  <path d="M306,166 L326,166" class="line"/>
  <path d="M526,166 L546,166" class="line"/>
  <path d="M426,136 L426,129 L853,129 L853,136" class="line"/>
  <path d="M130,272 L130,312" class="line"/>
  <path d="M372,272 L372,312" class="line"/>
  <path d="M612,272 L612,312" class="line"/>
  <path d="M850,272 L850,312" class="line"/>
  <path d="M245,360 L260,360" class="line"/>
  <path d="M485,360 L500,360" class="line"/>
  <path d="M130,408 L130,448" class="line"/>
  <path d="M372,408 L372,448" class="line"/>
  <path d="M200,408 L200,424 L730,424 L730,448" class="line"/>
  <path d="M20,380 L10,380 L10,589 L20,589" class="line"/>
  <path d="M450,518 L450,558" class="line"/>
  <path d="M810,518 L810,558" class="line"/>
</svg>
